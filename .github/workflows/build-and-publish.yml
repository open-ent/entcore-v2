name: Build & Publish to GitHub Packages

on:
  push:
    branches:
      - '*-patched'
      - '*-patched-dev'
  workflow_dispatch:
    inputs:
      entcore_version:
        description: 'Version à publier (ex: 6.14.9-patched). Laissez vide pour utiliser la version du pom.xml.'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

concurrency:
  group: build-and-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build & Publish entcore to GitHub Packages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Configure Maven pour GitHub Packages
        # Deux dépôts de dépendances sont nécessaires depuis la 6.16 :
        #   - github     : fr.openent:app-parent (le parent du pom, publié depuis ce dépôt) ;
        #   - pt-releases: org.entcore:common / session / broker, qui ne font plus partie
        #                  d'entcore depuis que l'amont les a extraits (6.16, #SRE-5075). Notre
        #                  fork patché de ces libs (open-ent/edifice-entcore-libs) publie sur
        #                  rct-nexus et NON sur GitHub Packages : ces noms de packages y sont
        #                  déjà réservés par entcore-v2 pour la 6.14.9-patched, et GitHub
        #                  Packages n'autorise qu'un seul dépôt propriétaire par package.
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>$GITHUB_ACTOR</username>
                <password>$GITHUB_TOKEN</password>
              </server>
              <server>
                <id>pt-releases</id>
                <username>$NEXUS_USER</username>
                <password>$NEXUS_PASSWORD</password>
              </server>
            </servers>
            <profiles>
              <profile>
                <id>github-packages</id>
                <repositories>
                  <repository>
                    <id>github</id>
                    <name>GitHub open-ent Packages</name>
                    <url>https://maven.pkg.github.com/open-ent/entcore-v2</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>true</enabled></snapshots>
                  </repository>
                  <repository>
                    <id>pt-releases</id>
                    <name>rct-nexus maven-releases (entcore-libs patchées)</name>
                    <url>https://rct-nexus.tech.fr/repository/maven-releases/</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>false</enabled></snapshots>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>github-packages</activeProfile>
            </activeProfiles>
          </settings>
          EOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

      # Les libs (org.entcore:common, session…) sont republiées À VERSION IDENTIQUE
      # (6.16.7-patched) : Maven tient une release pour immuable et le cache de setup-java
      # resservirait l'ancien jar. common est embarqué dans chaque fat-jar : un cache périmé
      # republierait entcore avec les anciens correctifs, sans aucun message.
      - name: Purger org.entcore du cache Maven
        run: rm -rf ~/.m2/repository/org/entcore

      - name: Resolve revision
        run: |
          if [ -n "${{ github.event.inputs.entcore_version }}" ]; then
            echo "REVISION=${{ github.event.inputs.entcore_version }}" >> $GITHUB_ENV
          else
            REVISION=$(mvn help:evaluate -Dexpression=revision -q -DforceStdout -B 2>/dev/null || echo "")
            echo "REVISION=${REVISION}" >> $GITHUB_ENV
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Delete existing package versions to allow re-deployment
        run: |
          python3 << 'PYEOF'
          import urllib.request
          import urllib.parse
          import json
          import os

          token = os.environ['GITHUB_TOKEN']
          version = os.environ.get('REVISION', '')
          org = 'open-ent'

          if not version:
              print('No revision resolved, skipping cleanup')
              exit(0)

          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28'
          }

          def api_call(url, method='GET'):
              req = urllib.request.Request(url, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req) as r:
                      if method == 'GET':
                          return json.loads(r.read())
                      return True
              except urllib.error.HTTPError as e:
                  print(f'{method} {url} -> HTTP {e.code}: {e.reason}')
                  return [] if method == 'GET' else False

          packages_url = f'https://api.github.com/orgs/{org}/packages?package_type=maven&per_page=100'
          packages = api_call(packages_url)
          if not isinstance(packages, list):
              print('Could not list packages (token may lack read:packages scope in this context)')
              exit(0)

          for pkg in packages:
              pkg_name = pkg['name']
              pkg_name_enc = urllib.parse.quote(pkg_name, safe='')
              pkg_url = f'https://api.github.com/orgs/{org}/packages/maven/{pkg_name_enc}'
              versions_url = f'{pkg_url}/versions'
              versions = api_call(versions_url)
              if not isinstance(versions, list):
                  continue
              matching = [v for v in versions if v.get('name') == version]
              if not matching:
                  continue
              if len(versions) == 1:
                  # Only one version: delete the entire package
                  print(f'Deleting entire package {pkg_name} (only version: {version})')
                  api_call(pkg_url, method='DELETE')
              else:
                  # Multiple versions: delete just the matching version
                  for v in matching:
                      vid = v['id']
                      print(f'Deleting version {pkg_name}:{version} (id={vid})')
                      api_call(f'{versions_url}/{vid}', method='DELETE')
          PYEOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26

      - name: Build frontends gulp (archive, auth, directory, timeline, workspace)
        # Ces 5 modules ont un frontend GÉNÉRÉ, pas versionné :
        #   - view/          <- gulp updateRefs, copie view-src/**/*.{html,txt,json} en
        #                       substituant @@VERSION   (gitignoré, cf. .gitignore 37-69)
        #   - public/dist/   <- webpack sur public/**/*.ts                (gitignoré, **/dist)
        # Sans cette étape, un clone CI frais n'en contient RIEN et `mvn deploy` publie des
        # fat-jars amputés : renderView() ne trouve plus son template et la page casse SANS
        # aucune stack dans le launcher (panne muette). C'est ce qui a cassé /userbook/mon-compte
        # (directory), l'écran de sauvegarde (archive) et les vues timeline le 2026-08-10.
        # Équivalent CI de `build.sh buildNode` (Node 26 ; gulp 5, webpack 1.x de webpack-stream
        # appelé en direct par le gulpfile).
        run: |
          npm install --legacy-peer-deps
          node_modules/gulp/bin/gulp.js build
          # Garde-fou : mieux vaut un CI rouge qu'un artefact creux publié sur nexus.
          for a in archive auth directory timeline workspace; do
            ls "$a/src/main/resources/view/"*.html >/dev/null 2>&1 \
              || { echo "::error::${a} : view/ vide après gulp build — artefact non publiable"; exit 1; }
          done

      - name: Build conversation React frontend
        # Sans cette étape le fat-jar conversation n'embarque pas view/index.html
        # (gitignoré) → ConversationController.renderView("index.html") → 500 sur
        # GET /conversation/conversation. On build le frontend en CI avec un .npmrc
        # minimal : seul @open-ent (GitHub Packages) nécessite un token = GITHUB_TOKEN.
        # tiptap-pro/NPM_TOKEN ne sont pas des dépendances réelles (absentes du lock).
        env:
          # @open-ent/* est publié sur GitHub Packages depuis d'autres repos de l'org :
          # le GITHUB_TOKEN par défaut (scope repo) renvoie 403, il faut un PAT org (read:packages).
          NODE_AUTH_TOKEN: ${{ secrets.OPENENT_PACKAGES_TOKEN }}
        run: |
          # Node ≥ 25 n'embarque plus corepack : pnpm s'installe explicitement (packageManager).
          npm i -g pnpm@8.6.6
          cd conversation/frontend
          # package.json est généré depuis package.json.template (cf. build.sh init).
          # Sans manifeste, pnpm remonte à la racine entcore-v2 et n'installe pas vite.
          cp package.json.template package.json
          sed -i "s/%branch%/${GITHUB_REF_NAME}/; s/%generateVersion%/$(date +%Y%m%d%H%M)/; s/%packageVersion%/${GITHUB_REF_NAME}/" package.json
          # .npmrc minimal : seul @open-ent (GitHub Packages) requiert un token (GITHUB_TOKEN).
          cat > .npmrc <<'EOF'
          @open-ent:registry=https://npm.pkg.github.com
          //npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}
          auto-install-peers=true
          EOF
          pnpm install --no-frozen-lockfile
          pnpm exec vite build   # vite build direct (sans typecheck, qui n'est pas requis au packaging)
          cd ../..
          DST=conversation/backend/src/main/resources
          mkdir -p "$DST/view"
          cp -R conversation/frontend/dist/* "$DST/"
          [ -f "$DST/index.html" ] && mv -f "$DST/index.html" "$DST/view/index.html" || true
          test -f "$DST/view/index.html" || { echo "::error::conversation view/index.html manquant après build"; exit 1; }
          test -n "$(ls "$DST"/public/index-*.js 2>/dev/null)" || { echo "::error::bundle public/index-*.js manquant"; exit 1; }

      - name: Build React frontends ?ui=react (directory, timeline, workspace)
        # Les vues *-react.html (mon-compte, annuaire, historique, préférences) chargent un
        # bundle IIFE unique /<module>/public/react/<module>.js produit par Vite. Sans cette
        # étape le jar ne l'embarque pas : la vue répond 200 mais la page reste blanche
        # (script en 404) — /userbook/mon-compte?ui=react le 2026-11-03.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.OPENENT_PACKAGES_TOKEN }}
        run: |
          # packageManager de ces trois sous-projets : pnpm@9.12.2 (pas de corepack sous Node 26).
          npm i -g pnpm@9.12.2
          for spec in directory:frontend:directory timeline:frontend-account:timeline workspace:frontend:workspace; do
            IFS=: read -r mod dir entry <<< "$spec"
            (cd "$mod/$dir" && pnpm install --no-frozen-lockfile && pnpm build)
            DST="$mod/src/main/resources/public/react"
            rm -rf "$DST" && mkdir -p "$DST"
            cp -R "$mod/$dir/dist/." "$DST/"
            rm -f "$DST/index.html"
            test -f "$DST/$entry.js" || { echo "::error::${mod} : bundle public/react/${entry}.js manquant"; exit 1; }
          done

      - name: Build admin Angular frontend
        # L'admin (/admin) est une app Angular MODERNE (admin/src/main/ts). Sans build,
        # le fat-mod ne contient NI public/dist NI view/admin.html -> renderView casse
        # -> GET /admin renvoie 500 (panne muette, aucune stack). L'ancienne CI ne buildait
        # ni via l'étape gulp (5 modules vanilla) ni via conversation React -> admin oublié.
        # npm run build-prod = `ng build --prod && gulp build` : gulp copie dist ->
        # src/main/resources/public/dist et renomme index.html -> view/admin.html (packagé
        # par mvn). Deps 100% publiques (aucun @open-ent/@edifice) -> pas de token requis.
        # Angular 14 se construit tel quel sous Node 26 (sortie identique octet pour octet à
        # celle de Node 20 avec les mêmes dépendances) : --openssl-legacy-provider n'est plus requis.
        run: |
          cd admin/src/main/ts
          npm install --legacy-peer-deps
          npm run build-prod
          cd ../../../..
          test -f admin/src/main/resources/view/admin.html \
            || { echo "::error::admin view/admin.html manquant apres build"; exit 1; }
          test -n "$(ls admin/src/main/resources/public/dist/*.js 2>/dev/null)" \
            || { echo "::error::admin public/dist manquant apres build"; exit 1; }

      - name: Build and publish to GitHub Packages
        # GITHUB_TOKEN ne peut jamais lister/supprimer des packages au niveau de l'org (testé :
        # renvoie une liste vide en silence) — l'ancienne étape de purge pré-déploiement était donc
        # du code mort. Le vrai déclencheur du 409 est une course : push sur `*-patched-dev` et
        # workflow_dispatch sur `*-patched` publiant le même commit/révision en parallèle (cf.
        # `concurrency:` ci-dessus, qui sérialise désormais ces deux triggers). Si malgré ça la
        # révision est déjà publiée à l'identique (redéclenchement redondant), on traite le 409
        # comme un succès idempotent plutôt que de faire échouer le job pour rien.
        #
        # `-pl '!tests'` : le module `tests` n'est PAS un livrable (scénarios de charge Gatling
        # 2.3.1 en Scala 2.12.3, compilés par org.scala-tools:maven-scala-plugin:2.15.2). Scalac
        # 2.12.3 ne sait pas relire les .class des JDK récents (21, 25) et meurt sur
        # `bad constant pool index: 0` en lisant java.lang.String. Le défaut était masqué :
        # jusqu'ici le reactor mourait dès la racine sur un 409 (aucun package n'était purgé
        # avant le deploy), 409 avalé comme « succès idempotent » -> les 24 modules étaient
        # SKIPPED et la CI verte ne publiait RIEN. Depuis que l'étape de purge des versions
        # rend le deploy réellement possible, le reactor va jusqu'au bout et bute sur `tests`.
        # On l'exclut du job de publication : les scénarios Gatling se lancent à part, sur un
        # JDK compatible, et leur fat-jar n'a jamais eu à partir sur GitHub Packages ni nexus.
        run: |
          REVISION_OPT=""
          if [ -n "${{ github.event.inputs.entcore_version }}" ]; then
            REVISION_OPT="-Drevision=${{ github.event.inputs.entcore_version }}"
          fi
          set +e
          mvn deploy -DskipTests -DskipITs -B \
            -pl '!tests' \
            ${REVISION_OPT} \
            -DbuildNumber="${GITHUB_SHA::8}" -DscmBranch="${GITHUB_REF_NAME}" \
            -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/${{ github.repository }} \
            | tee /tmp/mvn-deploy.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ]; then
            if grep -q "status code: 409" /tmp/mvn-deploy.log; then
              echo "::warning::Révision déjà publiée à l'identique (409 Conflict) — traité comme succès."
            else
              exit "$STATUS"
            fi
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      # Depuis le JDK 23, javac n'exécute plus les processeurs d'annotations trouvés sur le
      # classpath : sans `-proc:full` (pom racine), les jars partent sans securedaction/ ni
      # routes/, et chaque route sécurisée répond 404 — sans aucune erreur de build. Contrôle
      # avant la publication sur rct-nexus (celle que sert le launcher). feeder n'a pas de
      # contrôleur @SecuredAction : il n'a ni l'un ni l'autre.
      - name: Verify annotation metadata
        run: |
          for m in admin app-registry archive audience auth cas communication conversation directory infra interoperability portal timeline workspace; do
            FAT_JAR=$(find . -path '*/target/*' -name "org.entcore~${m}~*-fat.jar" | head -1)
            [ -n "$FAT_JAR" ] || { echo "::error::fat-jar de ${m} introuvable"; exit 1; }
            for d in securedaction routes; do
              unzip -Z1 "$FAT_JAR" | grep -q "^$d/" || { echo "::error::$d/ absent de $FAT_JAR"; exit 1; }
            done
          done

      - name: Publish fat JARs to rct-nexus
        env:
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          cat > /tmp/nx-settings.xml <<EOF
          <settings><servers><server><id>pt-releases</id><username>${NEXUS_USER}</username><password>${NEXUS_PASSWORD}</password></server></servers></settings>
          EOF
          NEXUS_BASE="https://rct-nexus.tech.fr"
          # maven-releases est IMMUABLE : redéployer une version -patched existante renvoie 409,
          # avalé jusqu'ici par continue-on-error (bug systémique déjà connu sur ~40 modules —
          # cf mémoire ci-nexus-clobber-systemic). On supprime donc la version existante AVANT de
          # redéployer (delete-then-deploy), sinon l'ancien jar persiste et le launcher continue de
          # servir du code périmé alors que la CI affiche "success".
          for FAT in $(find . -name "org.entcore~*~*-fat.jar" | grep -v SNAPSHOT); do
            FAT_ABS=$(realpath "${FAT}")
            BASE=$(basename "${FAT}" -fat.jar)
            GROUP_ID=${BASE%%~*}; REST=${BASE#*~}; ARTIFACT_ID=${REST%%~*}; VERSION=${REST#*~}
            SEARCH="${NEXUS_BASE}/service/rest/v1/search?repository=maven-releases&maven.groupId=${GROUP_ID}&maven.artifactId=${ARTIFACT_ID}&maven.baseVersion=${VERSION}"
            for ID in $(curl -sf -u "${NEXUS_USER}:${NEXUS_PASSWORD}" "${SEARCH}" | python3 -c "import sys,json;[print(i['id']) for i in json.load(sys.stdin).get('items',[])]"); do
              echo "Suppression du composant nexus existant ${ID}"
              curl -sf -u "${NEXUS_USER}:${NEXUS_PASSWORD}" -X DELETE "${NEXUS_BASE}/service/rest/v1/components/${ID}" || echo "::warning::échec suppression ${ID}"
            done
            sleep 3
            echo "Deploying ${GROUP_ID}:${ARTIFACT_ID}:${VERSION}:fat -> rct-nexus"
            ( cd /tmp && mvn deploy:deploy-file -s /tmp/nx-settings.xml -Dfile="${FAT_ABS}" -DgroupId="${GROUP_ID}" -DartifactId="${ARTIFACT_ID}" -Dversion="${VERSION}" -Dclassifier=fat -Dpackaging=jar -DrepositoryId=pt-releases -Durl="${NEXUS_BASE}/repository/maven-releases/" -B )
          done
