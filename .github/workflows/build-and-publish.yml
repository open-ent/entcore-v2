name: Build & Publish to GitHub Packages

on:
  push:
    branches:
      - '*-patched'
      - '*-patched-dev'
  workflow_dispatch:
    inputs:
      entcore_version:
        description: 'Version à publier (ex: 6.14.9-patched). Laissez vide pour utiliser la version du pom.xml.'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: Build & Publish entcore to GitHub Packages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: temurin
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Override revision si fourni via workflow_dispatch
        if: ${{ github.event.inputs.entcore_version != '' }}
        run: echo "REVISION_OPT=-Drevision=${{ github.event.inputs.entcore_version }}" >> $GITHUB_ENV

      - name: Build and publish to GitHub Packages
        run: |
          mvn deploy -DskipTests -DskipITs -B \
            ${REVISION_OPT:-} \
            -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/${{ github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
