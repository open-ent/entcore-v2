name: Build & Publish to GitHub Packages

on:
  push:
    branches:
      - '*-patched'
      - '*-patched-dev'
  workflow_dispatch:
    inputs:
      entcore_version:
        description: 'Version à publier (ex: 6.14.9-patched). Laissez vide pour utiliser la version du pom.xml.'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: Build & Publish entcore to GitHub Packages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: temurin
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Resolve revision
        run: |
          if [ -n "${{ github.event.inputs.entcore_version }}" ]; then
            echo "REVISION=${{ github.event.inputs.entcore_version }}" >> $GITHUB_ENV
          else
            REVISION=$(mvn help:evaluate -Dexpression=revision -q -DforceStdout -B 2>/dev/null || echo "")
            echo "REVISION=${REVISION}" >> $GITHUB_ENV
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Delete existing package versions to allow re-deployment
        run: |
          python3 << 'PYEOF'
          import urllib.request
          import urllib.parse
          import json
          import os

          token = os.environ['GITHUB_TOKEN']
          version = os.environ.get('REVISION', '')
          org = 'open-ent'

          if not version:
              print('No revision resolved, skipping cleanup')
              exit(0)

          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28'
          }

          def api_call(url, method='GET'):
              req = urllib.request.Request(url, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req) as r:
                      if method == 'GET':
                          return json.loads(r.read())
                      return True
              except urllib.error.HTTPError as e:
                  print(f'{method} {url} -> HTTP {e.code}: {e.reason}')
                  return [] if method == 'GET' else False

          packages_url = f'https://api.github.com/orgs/{org}/packages?package_type=maven&per_page=100'
          packages = api_call(packages_url)
          if not isinstance(packages, list):
              print('Could not list packages (token may lack read:packages scope in this context)')
              exit(0)

          for pkg in packages:
              pkg_name = pkg['name']
              pkg_name_enc = urllib.parse.quote(pkg_name, safe='')
              versions_url = f'https://api.github.com/orgs/{org}/packages/maven/{pkg_name_enc}/versions'
              versions = api_call(versions_url)
              if not isinstance(versions, list):
                  continue
              for v in versions:
                  if v.get('name') == version:
                      vid = v['id']
                      print(f'Deleting {pkg_name}:{version} (id={vid})')
                      api_call(f'{versions_url}/{vid}', method='DELETE')
          PYEOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish to GitHub Packages
        run: |
          REVISION_OPT=""
          if [ -n "${{ github.event.inputs.entcore_version }}" ]; then
            REVISION_OPT="-Drevision=${{ github.event.inputs.entcore_version }}"
          fi
          mvn deploy -DskipTests -DskipITs -B \
            ${REVISION_OPT} \
            -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/${{ github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
