name: Build & Publish to GitHub Packages

on:
  push:
    branches:
      - '*-patched'
      - '*-patched-dev'
  workflow_dispatch:
    inputs:
      entcore_version:
        description: 'Version à publier (ex: 6.14.9-patched). Laissez vide pour utiliser la version du pom.xml.'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: Build & Publish entcore to GitHub Packages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: temurin
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Configure Maven pour GitHub Packages
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>$GITHUB_ACTOR</username>
                <password>$GITHUB_TOKEN</password>
              </server>
            </servers>
            <profiles>
              <profile>
                <id>github-packages</id>
                <repositories>
                  <repository>
                    <id>github</id>
                    <name>GitHub open-ent Packages</name>
                    <url>https://maven.pkg.github.com/open-ent/entcore-v2</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>true</enabled></snapshots>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>github-packages</activeProfile>
            </activeProfiles>
          </settings>
          EOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Resolve revision
        run: |
          if [ -n "${{ github.event.inputs.entcore_version }}" ]; then
            echo "REVISION=${{ github.event.inputs.entcore_version }}" >> $GITHUB_ENV
          else
            REVISION=$(mvn help:evaluate -Dexpression=revision -q -DforceStdout -B 2>/dev/null || echo "")
            echo "REVISION=${REVISION}" >> $GITHUB_ENV
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Delete existing package versions to allow re-deployment
        run: |
          python3 << 'PYEOF'
          import urllib.request
          import urllib.parse
          import json
          import os

          token = os.environ['GITHUB_TOKEN']
          version = os.environ.get('REVISION', '')
          org = 'open-ent'

          if not version:
              print('No revision resolved, skipping cleanup')
              exit(0)

          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28'
          }

          def api_call(url, method='GET'):
              req = urllib.request.Request(url, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req) as r:
                      if method == 'GET':
                          return json.loads(r.read())
                      return True
              except urllib.error.HTTPError as e:
                  print(f'{method} {url} -> HTTP {e.code}: {e.reason}')
                  return [] if method == 'GET' else False

          packages_url = f'https://api.github.com/orgs/{org}/packages?package_type=maven&per_page=100'
          packages = api_call(packages_url)
          if not isinstance(packages, list):
              print('Could not list packages (token may lack read:packages scope in this context)')
              exit(0)

          for pkg in packages:
              pkg_name = pkg['name']
              pkg_name_enc = urllib.parse.quote(pkg_name, safe='')
              pkg_url = f'https://api.github.com/orgs/{org}/packages/maven/{pkg_name_enc}'
              versions_url = f'{pkg_url}/versions'
              versions = api_call(versions_url)
              if not isinstance(versions, list):
                  continue
              matching = [v for v in versions if v.get('name') == version]
              if not matching:
                  continue
              if len(versions) == 1:
                  # Only one version: delete the entire package
                  print(f'Deleting entire package {pkg_name} (only version: {version})')
                  api_call(pkg_url, method='DELETE')
              else:
                  # Multiple versions: delete just the matching version
                  for v in matching:
                      vid = v['id']
                      print(f'Deleting version {pkg_name}:{version} (id={vid})')
                      api_call(f'{versions_url}/{vid}', method='DELETE')
          PYEOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish to GitHub Packages
        run: |
          REVISION_OPT=""
          if [ -n "${{ github.event.inputs.entcore_version }}" ]; then
            REVISION_OPT="-Drevision=${{ github.event.inputs.entcore_version }}"
          fi
          mvn deploy -DskipTests -DskipITs -B \
            ${REVISION_OPT} \
            -DbuildNumber="${GITHUB_SHA::8}" -DscmBranch="${GITHUB_REF_NAME}" \
            -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/${{ github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Publish fat JARs to rct-nexus
        continue-on-error: true
        env:
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          cat > /tmp/nx-settings.xml <<EOF
          <settings><servers><server><id>pt-releases</id><username>${NEXUS_USER}</username><password>${NEXUS_PASSWORD}</password></server></servers></settings>
          EOF
          for FAT in $(find . -name "org.entcore~*~*-fat.jar" | grep -v SNAPSHOT); do
            FAT_ABS=$(realpath "${FAT}")
            BASE=$(basename "${FAT}" -fat.jar)
            GROUP_ID=${BASE%%~*}; REST=${BASE#*~}; ARTIFACT_ID=${REST%%~*}; VERSION=${REST#*~}
            echo "Deploying ${GROUP_ID}:${ARTIFACT_ID}:${VERSION}:fat -> rct-nexus"
            ( cd /tmp && mvn deploy:deploy-file -s /tmp/nx-settings.xml -Dfile="${FAT_ABS}" -DgroupId="${GROUP_ID}" -DartifactId="${ARTIFACT_ID}" -Dversion="${VERSION}" -Dclassifier=fat -Dpackaging=jar -DrepositoryId=pt-releases -Durl="https://rct-nexus.tech.fr/repository/maven-releases/" -B )
          done
