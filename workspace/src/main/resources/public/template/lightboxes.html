<lightbox show="!template.isEmpty('lightbox')" on-close="template.close('lightbox')" delegate-close="lightboxDelegateClose()" on-show="resetLightboxDelegateClose()">
    <container template="lightbox"></container>
</lightbox>
<lightbox show="display.share">
    <container template="share"></container>
</lightbox>
<div ng-if="display.editImage">
    <image-editor document="display.editedImage" show="display.editImage" on-save="refreshImage(display.editedImage)"></image-editor>
</div>
<import-files show="display.importFiles"></import-files>

<!-- Sélecteur de dossier NextCloud pour « Déplacer / Partager vers NextCloud » (docs natifs).
     On navigue dans l'arbre NextCloud ; « Valider » envoie les documents sélectionnés
     dans le dossier COURANT (display.ncShare.path ; vide = racine). Cf. delegates/nextcloudShare.ts -->
<lightbox show="display.ncShare.opened" on-close="closeNextcloudShare()">
    <h2><i18n>nextcloud.share.picker.title</i18n></h2>
    <div class="row">
        <button type="button" ng-click="browseNextcloudFolder('')" ng-disabled="!display.ncShare.path">
            <i18n>nextcloud.share.picker.root</i18n>
        </button>
        <span ng-if="display.ncShare.path"> / [[display.ncShare.path]]</span>
    </div>
    <div ng-if="display.ncShare.loading" class="row">…</div>
    <ul ng-if="!display.ncShare.loading" class="nextcloud-folder-picker">
        <li ng-repeat="folder in display.ncShare.folders">
            <button type="button" ng-click="browseNextcloudFolder(folder.path)">📁 [[folder.name]]</button>
        </li>
        <li ng-if="display.ncShare.folders.length === 0" class="empty">—</li>
    </ul>
    <div class="row right-magnet">
        <button type="button" class="cancel" ng-click="closeNextcloudShare()">
            <i18n>nextcloud.share.cancel</i18n>
        </button>
        <button type="button" ng-click="confirmNextcloudShare()" ng-disabled="display.ncShare.submitting">
            <i18n>nextcloud.share.confirm</i18n>
        </button>
    </div>
</lightbox>

<!-- Lool Modal Overlay -->
<div ng-if="display.loolModal" ng-click="closeLoolModal($event)" class="lool-modal-overlay">
    <div class="lool-modal-container" ng-click="$event.stopPropagation()">
        <iframe 
            ng-src="[[display.loolModalUrl]]"
            class="lool-modal-iframe"
            ng-class="{'loaded': display.loolModalLoaded}"
            id="lool-modal-iframe"
            frameborder="0"
            onload="angular.element(this).scope().onLoolModalLoad()">
        </iframe>
    </div>
</div>

<style>

.lool-modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 10000;
}

.lool-modal-container {
    width: 100%;
    height: 100%;
}

.lool-modal-iframe {
    width: 100%;
    height: 100%;
    border: none;
    opacity: 0;
    transition: opacity 0.2s ease-in-out;
}

.lool-modal-iframe.loaded {
    opacity: 1;
}
</style>
